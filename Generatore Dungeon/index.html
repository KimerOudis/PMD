<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Generatore Dungeon PMD - Configurazione Completa</title>
  <style>
    :root {
      --bg-color: #1e1e24;
      --card-bg: #e2e8f0;
      --card-border: #0f172a;
      --accent-red: #e3350d;
      --accent-red-hover: #b82708;
      --accent-blue: #2563eb;
      --text-main: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg-color);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0 0 1rem 0;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0px var(--card-border);
    }

    .settings-container {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 8px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      color: var(--text-main);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 4px;
      margin: 10px 0 8px 0;
      color: #334155;
    }
    .section-title:first-child { margin-top: 0; }

    .grid-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 8px;
    }

    .labeled-box {
      display: flex;
      flex-direction: column;
    }

    .labeled-box label {
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 3px;
    }

    .checkbox-box {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .checkbox-box input { width: auto; }

    select, input[type="number"], input[type="text"] {
      padding: 0.45rem;
      font-size: 0.9rem;
      border: 2px solid var(--card-border);
      border-radius: 4px;
      background: white;
      font-weight: bold;
      color: var(--text-main);
      width: 100%;
    }

    .actions-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      padding-top: 10px;
      border-top: 2px solid var(--card-border);
    }

    .action-btn {
      background: var(--accent-red);
      color: white;
      border: 2px solid var(--card-border);
      border-radius: 4px;
      font-weight: bold;
      font-size: 1.05rem;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.7rem 2rem;
      box-shadow: 0 3px 0 var(--card-border);
      transition: all 0.1s ease;
    }

    .action-btn:hover { background: var(--accent-red-hover); }
    .action-btn:active { transform: translateY(2px); box-shadow: none; }

    .canvas-wrapper {
      max-width: 95vw;
      overflow: auto;
      border: 3px solid var(--card-border);
      border-radius: 6px;
      background: #000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .legend {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-square { width: 12px; height: 12px; display: inline-block; }
  </style>
</head>
<body>

  <h1>Generatore Layout Dungeon PMD</h1>

  <div class="settings-container">

    <!-- 1. Stile Grafico e Layout -->
    <div class="section-title">Struttura Generale</div>
    <div class="grid-row">
      <div class="labeled-box">
        <label>Tileset</label>
        <select id="p-tileset">
          <option value="tilesets/tileset100_dpc.png">Tileset 100 (Neve / Ghiaccio)</option>
          <option value="tilesets/tileset101_dpc.png" selected>Tileset 101 (Deserto / Tempio)</option>
          <option value="tilesets/tileset102_dpc.png">Tileset 102 (Canyon Sabbioso)</option>
          <option value="tilesets/tileset103_dpc.png">Tileset 103 (Caverna Rocciosa)</option>
        </select>
      </div>

      <div class="labeled-box">
        <label>Forma del Piano (Layout)</label>
        <select id="p-layout">
          <option value="0" selected>Large (Standard Grande)</option>
          <option value="1">Small (Standard Piccolo)</option>
          <option value="11">Medium (Standard Medio)</option>
          <option value="2">One Room Monster House</option>
          <option value="3">Outer Ring (Anello Esterno)</option>
          <option value="4">Crossroads (Crocevia Incrociato)</option>
          <option value="5">Two Rooms Monster House</option>
          <option value="6">Line (Linea Orizzontale)</option>
          <option value="7">Cross (Croce a 5 Stanze)</option>
          <option value="8">Large 0x8</option>
          <option value="9">Beetle (Scarabeo Colonna Centrale)</option>
          <option value="10">Outer Rooms (Stanze Perimetrali)</option>
        </select>
      </div>

      <div class="labeled-box">
        <label>Densità Stanze (Room Density)</label>
        <input type="number" id="p-room-density" value="4" min="1" max="15">
      </div>

      <div class="labeled-box">
        <label>Connettività Corridoi</label>
        <input type="number" id="p-floor-connectivity" value="15" min="1" max="50">
      </div>

      <div class="labeled-box">
        <label>Corridoi Extra</label>
        <input type="number" id="p-extra-hallways" value="0" min="0" max="30">
      </div>

      <div class="checkbox-box">
        <input type="checkbox" id="p-allow-dead-ends">
        <label for="p-allow-dead-ends">Permetti Vicoli Ciechi</label>
      </div>
    </div>

    <!-- 2. Densità Entità e Spawns -->
    <div class="section-title">Densità Spawns</div>
    <div class="grid-row">
      <div class="labeled-box">
        <label>Densità Nemici</label>
        <input type="number" id="p-enemy-density" value="8" min="0" max="30">
      </div>

      <div class="labeled-box">
        <label>Densità Strumenti</label>
        <input type="number" id="p-item-density" value="4" min="0" max="25">
      </div>

      <div class="labeled-box">
        <label>Densità Strumenti Sepolti</label>
        <input type="number" id="p-buried-item-density" value="0" min="0" max="25">
      </div>

      <div class="labeled-box">
        <label>Densità Trappole</label>
        <input type="number" id="p-trap-density" value="5" min="0" max="30">
      </div>
    </div>

    <!-- 3. Eventi Speciali e Stanze Rare -->
    <div class="section-title">Probabilità Eventi e Stanze Speciali (%)</div>
    <div class="grid-row">
      <div class="labeled-box">
        <label>Shop Kecleon (%)</label>
        <input type="number" id="p-kecleon-chance" value="0" min="0" max="100">
      </div>

      <div class="labeled-box">
        <label>Tana / Monster House (%)</label>
        <input type="number" id="p-monster-house-chance" value="0" min="0" max="100">
      </div>

      <div class="labeled-box">
        <label>Tana Senza Strumenti (%)</label>
        <input type="number" id="p-itemless-mh-chance" value="0" min="0" max="100">
      </div>

      <div class="labeled-box">
        <label>Stanza Labirinto (%)</label>
        <input type="number" id="p-maze-chance" value="0" min="0" max="100">
      </div>
    </div>

    <!-- 4. Terreno Secondario (Acqua/Lava) e Strutture -->
    <div class="section-title">Terreno Secondario & Modificatori Stanze</div>
    <div class="grid-row">
      <div class="labeled-box">
        <label>Densità Terreno Sec. (Laghetti)</label>
        <input type="number" id="p-secondary-density" value="10" min="0" max="30">
      </div>

      <div class="labeled-box">
        <label>Budget Strutture Interne</label>
        <input type="number" id="p-secondary-structures" value="0" min="0" max="10">
      </div>

      <div class="checkbox-box">
        <input type="checkbox" id="p-flag-secondary" checked>
        <label for="p-flag-secondary">Genera Fiumi / Laghi</label>
      </div>

      <div class="checkbox-box">
        <input type="checkbox" id="p-flag-imperfections">
        <label for="p-flag-imperfections">Imperfezioni Pareti</label>
      </div>
    </div>

    <div class="actions-bar">
      <button id="btn-genera" class="action-btn">Genera Dungeon con Parametri 🎲</button>
    </div>

  </div>

  <div class="canvas-wrapper">
    <canvas id="dungeonCanvas"></canvas>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot-square" style="background: #facc15;"></span> Scale</div>
    <div class="legend-item"><span class="dot" style="background: #38bdf8;"></span> Strumento</div>
    <div class="legend-item"><span class="dot" style="background: #ef4444;"></span> Nemico</div>
  </div>

  <script type="module">
    import { GenerateDungeon } from './dungeon_engine/dungeon.js';
    import { FloorProperties, Dungeon } from './dungeon_engine/key_types.js';
    import { caricaTileset, drawDungeonOnCanvas } from './render_dungeon.js';

    const canvas = document.getElementById('dungeonCanvas');
    const btnGenera = document.getElementById('btn-genera');

    // Mappatura input HTML
    const pTileset = document.getElementById('p-tileset');
    const pLayout = document.getElementById('p-layout');
    const pRoomDensity = document.getElementById('p-room-density');
    const pFloorConnectivity = document.getElementById('p-floor-connectivity');
    const pExtraHallways = document.getElementById('p-extra-hallways');
    const pAllowDeadEnds = document.getElementById('p-allow-dead-ends');

    const pEnemyDensity = document.getElementById('p-enemy-density');
    const pItemDensity = document.getElementById('p-item-density');
    const pBuriedItemDensity = document.getElementById('p-buried-item-density');
    const pTrapDensity = document.getElementById('p-trap-density');

    const pKecleonChance = document.getElementById('p-kecleon-chance');
    const pMonsterHouseChance = document.getElementById('p-monster-house-chance');
    const pItemlessMhChance = document.getElementById('p-itemless-mh-chance');
    const pMazeChance = document.getElementById('p-maze-chance');

    const pSecondaryDensity = document.getElementById('p-secondary-density');
    const pSecondaryStructures = document.getElementById('p-secondary-structures');
    const pFlagSecondary = document.getElementById('p-flag-secondary');
    const pFlagImperfections = document.getElementById('p-flag-imperfections');

    async function rigeneraDungeon() {
      btnGenera.disabled = true;
      btnGenera.textContent = "Generazione in corso...";

      try {
        const tilesetImg = await caricaTileset(pTileset.value);

        const props = new FloorProperties();
        props.layout = parseInt(pLayout.value);
        props.room_density = parseInt(pRoomDensity.value);
        props.floor_connectivity = parseInt(pFloorConnectivity.value);
        props.num_extra_hallways = parseInt(pExtraHallways.value);
        props.allow_dead_ends = pAllowDeadEnds.checked;

        props.enemy_density = parseInt(pEnemyDensity.value);
        props.item_density = parseInt(pItemDensity.value);
        props.buried_item_density = parseInt(pBuriedItemDensity.value);
        props.trap_density = parseInt(pTrapDensity.value);

        props.kecleon_shop_chance = parseInt(pKecleonChance.value);
        props.monster_house_chance = parseInt(pMonsterHouseChance.value);
        props.itemless_monster_house_chance = parseInt(pItemlessMhChance.value);
        props.maze_room_chance = parseInt(pMazeChance.value);

        props.secondary_terrain_density = parseInt(pSecondaryDensity.value);
        props.secondary_structures_budget = parseInt(pSecondaryStructures.value);
        props.room_flags.f_secondary_terrain_generation = pFlagSecondary.checked;
        props.room_flags.f_room_imperfections = pFlagImperfections.checked;

        const data = new Dungeon();
        const map = GenerateDungeon(props, data);

        drawDungeonOnCanvas(canvas, map, tilesetImg);
      } catch (err) {
        console.error(err);
        alert("Errore durante la generazione!");
      } finally {
        btnGenera.disabled = false;
        btnGenera.textContent = "Genera Dungeon con Parametri 🎲";
      }
    }

    btnGenera.addEventListener('click', rigeneraDungeon);
    pTileset.addEventListener('change', rigeneraDungeon);

    // Prima generazione automatica
    rigeneraDungeon();
  </script>
</body>
</html>
