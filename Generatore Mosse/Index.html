<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Generatore MT Pokémon - RPG Sheet</title>
  <style>
    :root {
      --bg-color: #2b2b36;
      --card-bg: #e2e8f0;
      --card-border: #1e293b;
      --header-bg: #1e293b;
      --accent-red: #e3350d;
      --accent-red-hover: #b82708;
      --accent-green: #15803d;
      --accent-green-hover: #166534;
      --text-main: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 1.5rem;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
    }

    .sheet-container {
      max-width: 950px;
      margin: auto;
      background: #334155;
      padding: 1.5rem;
      border-radius: 10px;
      border: 3px solid #0f172a;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      color: #f8fafc;
      margin-top: 0;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0px #0f172a;
    }

    /* Griglia Controlli Superiori */
    .top-controls {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
      background: var(--card-bg);
      padding: 10px;
      border: 2px solid var(--card-border);
      border-radius: 6px;
      margin-bottom: 1.5rem;
    }

    .labeled-box {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .labeled-box label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 4px;
    }

    select, input {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border: 2px solid var(--card-border);
      border-radius: 4px;
      background: white;
      font-weight: bold;
      color: var(--text-main);
    }

    .action-btn {
      background: var(--accent-red);
      color: white;
      border: 2px solid var(--card-border);
      border-radius: 4px;
      font-weight: bold;
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 3px 0 var(--card-border);
      transition: all 0.1s ease;
    }

    .action-btn:hover { background: var(--accent-red-hover); }
    .action-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--card-border); }

    .btn-copy {
      background: var(--accent-green);
      color: white;
      border: 2px solid var(--card-border);
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.95rem;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.7rem 1rem;
      width: 100%;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 3px 0 var(--card-border);
      transition: all 0.1s ease;
    }

    .btn-copy:hover { background: var(--accent-green-hover); }
    .btn-copy:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--card-border); }

    /* Layout Principale (Scheda + Cronologia) */
    .sheet-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }

    .box-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 6px;
      padding: 1rem;
      position: relative;
    }

    .hidden { display: none !important; }

    /* Risultato Estrazione */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }

    .card-header h2 {
      margin: 0;
      font-size: 1.4rem;
      text-transform: uppercase;
      color: var(--card-border);
    }

    .badge-star {
      background: #f59e0b;
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      border: 1px solid #b45309;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .inner-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .inner-grid-4 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.2fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .field-display {
      background: white;
      border: 1.5px solid var(--card-border);
      border-radius: 4px;
      padding: 0.5rem;
      min-height: 38px;
      font-weight: 600;
      display: flex;
      align-items: center;
    }

    .price-highlight {
      color: #15803d;
      font-weight: 800;
      background: #f0fdf4;
    }

    textarea.field-display {
      width: 100%;
      height: 90px;
      resize: none;
      font-family: inherit;
      font-size: 0.95rem;
    }

    /* Cronologia */
    .history-title {
      margin: 0 0 10px 0;
      font-size: 1rem;
      text-transform: uppercase;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 4px;
      color: var(--card-border);
    }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 380px;
      overflow-y: auto;
    }

    .history-item {
      padding: 0.5rem;
      background: white;
      border: 1.5px solid var(--card-border);
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.1s ease;
    }

    .history-item:hover {
      background: #e2e8f0;
      border-color: var(--accent-red);
    }

    .history-item.active {
      background: #fee2e2;
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    @media (max-width: 768px) {
      .top-controls, .sheet-grid, .inner-grid-4 { grid-template-columns: 1fr; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <div class="sheet-container">
    <h1>Negozio MT Pokémon</h1>

    <!-- Controlli Superiori -->
    <div class="top-controls">
      <div class="labeled-box">
        <label>Livello / Rarità Stelle</label>
        <select id="filtro-stelle">
          <option value="tutte">Tutti i Livelli (★ - ★★★★★)</option>
          <option value="★">★ (Base)</option>
          <option value="★★">★★</option>
          <option value="★★★">★★★</option>
          <option value="★★★★">★★★★</option>
          <option value="★★★★★">★★★★★ (Rara)</option>
        </select>
      </div>
      <button id="btn-estrai" class="action-btn">
        <span>Estrai</span> 🎲
      </button>
    </div>

    <!-- Layout Principale -->
    <div class="sheet-grid">

      <!-- Scheda Dettaglio Mossa -->
      <div id="risultato" class="box-card hidden">
        <div class="card-header">
          <h2 id="mt-nome">---</h2>
          <span id="mt-stelle" class="badge-star">★</span>
        </div>

        <div class="inner-grid-2">
          <div class="labeled-box">
            <label>Tipo</label>
            <div id="mt-tipo" class="field-display">-</div>
          </div>
          <div class="labeled-box">
            <label>Categoria</label>
            <div id="mt-categoria" class="field-display">-</div>
          </div>
        </div>

        <div class="inner-grid-4">
          <div class="labeled-box">
            <label>Potenza</label>
            <div id="mt-potenza" class="field-display">-</div>
          </div>
          <div class="labeled-box">
            <label>PP</label>
            <div id="mt-pp" class="field-display">-</div>
          </div>
          <div class="labeled-box">
            <label>Bersaglio</label>
            <div id="mt-bersaglio" class="field-display">-</div>
          </div>
          <div class="labeled-box">
            <label>Prezzo</label>
            <div id="mt-prezzo" class="field-display price-highlight">-</div>
          </div>
        </div>

        <div class="labeled-box" style="margin-bottom: 10px;">
          <label>Condizioni</label>
          <div id="mt-condizioni" class="field-display">-</div>
        </div>

        <div class="labeled-box">
          <label>Altri Effetti</label>
          <textarea id="mt-effetti" class="field-display" readonly>-</textarea>
        </div>

        <!-- Pulsante Copia negli Appunti -->
        <button id="btn-copia-clipboard" class="btn-copy">
          <span>Copia negli Appunti</span> 📋
        </button>
      </div>

      <!-- Box Cronologia -->
      <div class="box-card">
        <h3 class="history-title">Cronologia Sessione</h3>
        <ul id="lista-cronologia" class="history-list">
          <li style="color: #64748b; font-style: italic; text-align: center; padding: 10px 0;">Nessuna estrazione</li>
        </ul>
      </div>

    </div>
  </div>

  <script src="mosse_data.js"></script>
  <script src="script.js"></script>
</body>
</html>
